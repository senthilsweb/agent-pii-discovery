name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "mkdocs.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l1-tests:
    # L1 rule: no network beyond pip, no model download, no secrets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (core + dev only — no presidio/spacy, no boto3)
        run: pip install --quiet -e ".[dev]"
      - name: Unit tests + corpus integrity
        run: pytest
