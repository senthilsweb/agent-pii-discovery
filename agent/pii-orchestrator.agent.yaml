# Claude Managed Agent — pii-orchestrator (coordinator)
#
# Apply ONCE (control plane), then store the returned id + version:
#   cd agent && AGENT_ID=$(ant beta:agents create < pii-orchestrator.agent.yaml --transform id -r)
# Update in place (new immutable version):
#   ant beta:agents update --agent-id "$AGENT_ID" --version <N> < pii-orchestrator.agent.yaml
# NEVER create agents in the request path — sessions reference {id, version}.
#
# The multiagent roster ids below are substituted by scripts/apply_control_plane.sh
# after the three subagent YAMLs are applied (create subagents first, then this).

name: pii-orchestrator
description: >-
  PII discovery coordinator. Plans and routes one document scan per session:
  deterministic pipeline steps + a single typed GenAI extraction step, fanned
  out per model under comparison. Never analyzes documents itself.
model:
  id: claude-opus-5
  effort: medium
system: "@./system_prompt.md"
tools:
  - type: agent_toolset_20260401
    default_config:
      enabled: true
    configs:
      - name: web_search
        enabled: false
      - name: web_fetch
        enabled: false
  # Host-side custom tools — executed by the session client; cloud credentials
  # never enter the sandbox.
  - type: custom
    name: cache_lookup
    description: >-
      Look up a prior result by (checksum, pipeline_version). Call only when
      the manifest says check_cache; a hit means the scan is skipped entirely.
    input_schema:
      type: object
      properties:
        checksum: { type: string }
        pipeline_version: { type: string }
      required: [checksum, pipeline_version]
  - type: custom
    name: persist_result
    description: >-
      Persist the assembled result to the results database (and S3 mirror when
      configured). Pass the full content of result.json as a string. Call
      exactly once, after assemble completes.
    input_schema:
      type: object
      properties:
        scan_id: { type: string }
        result_json: { type: string, description: Full JSON content of result.json }
      required: [scan_id, result_json]
multiagent:
  type: coordinator
  agents:
    - "__DOC_EXTRACTOR_ID__"
    - "__GENAI_SCANNER_ID__"
    - "__REPORT_ASSEMBLER_ID__"
